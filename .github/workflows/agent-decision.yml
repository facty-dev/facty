name: Decision Agent (Reusable)

# Reusable workflow — runs the decision agent in an ephemeral gondolin micro-VM.
# Used by: phase-discovery, phase-prd, phase-bdd, phase-review
#
# Runner prerequisites (self-hosted):
#   - gondolin (npm i -g @earendil-works/gondolin) + QEMU
#   - pi (npm i -g @earendil-works/pi-coding-agent)
#   - the gondolin-pi template + built snapshot (~/code/gondolin-pi;
#     override with GONDOLIN_PI repo var)
#   - MISTRAL_API_KEY (or MODEL_API_KEY) repo secret

on:
  workflow_call:
    inputs:
      phase:
        description: 'SDLC phase (discovery, prd, bdd, review)'
        required: true
        type: string
      task:
        description: 'Task description for the agent'
        required: true
        type: string
      model:
        description: 'Model to use (pi model id)'
        required: false
        type: string
        default: 'zai-glm-5-3'
      checkout_ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
    outputs:
      status:
        description: 'Agent execution status'
        value: ${{ jobs.run-decision-agent.outputs.status }}
      artifacts_path:
        description: 'Path to generated artifacts'
        value: ${{ jobs.run-decision-agent.outputs.artifacts_path }}

jobs:
  run-decision-agent:
    name: Run decision agent (${{ inputs.phase }})
    runs-on: ${{ vars.GONDOLIN_RUNNER_LABELS || 'self-hosted' }}
    outputs:
      status: ${{ steps.agent.outputs.status }}
      artifacts_path: ${{ steps.agent.outputs.artifacts_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.head_ref }}
          fetch-depth: 0

      - name: Check runtime prerequisites
        run: |
          command -v gondolin >/dev/null || { echo "::error::gondolin not installed on runner"; exit 1; }
          command -v pi >/dev/null || { echo "::error::pi not installed on runner"; exit 1; }
          GONDOLIN_PI="${GONDOLIN_PI:-$HOME/code/gondolin-pi}"
          [ -e "$GONDOLIN_PI/snapshots/pi-sandbox.qcow2" ] \
            || { echo "::error::pi-sandbox snapshot missing (build: $GONDOLIN_PI/gondolin-pi.sh build)"; exit 1; }
          echo "runtime ok: $GONDOLIN_PI"

      - name: Run decision agent in ephemeral gondolin VM
        id: agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MODEL_API_KEY }}
          AGENT_MODEL: ${{ inputs.model }}
          AGENT_THINKING: max
        run: |
          ./scripts/agent-pi.sh decision \
            --phase "${{ inputs.phase }}" \
            --task "${{ inputs.task }}"

          # Check if agent produced artifacts
          ARTIFACTS=""
          for dir in docs/discovery docs/prd specs docs/adr .agentic; do
            if [ -d "$dir" ] && [ -n "$(ls -A $dir 2>/dev/null)" ]; then
              ARTIFACTS="$ARTIFACTS $dir"
            fi
          done

          echo "status=success" >> $GITHUB_OUTPUT
          echo "artifacts_path=$ARTIFACTS" >> $GITHUB_OUTPUT

      - name: Commit agent artifacts
        run: |
          git config user.name "decision-agent"
          git config user.email "decision-agent@redyarn.dev"
          git add -A
          git commit -m "feat(sdlc): ${{ inputs.phase }} — decision agent output" || echo "No changes to commit"
          git push || echo "Push failed (may be up to date)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-agent-${{ inputs.phase }}-${{ github.run_id }}
          path: |
            .agentic/
            docs/discovery/
            docs/prd/
            specs/
            docs/adr/
          retention-days: 30
