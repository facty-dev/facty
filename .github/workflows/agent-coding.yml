name: Coding Agent (Reusable)

# Reusable workflow — runs the coding agent in an ephemeral gondolin micro-VM.
#
# Runner prerequisites (self-hosted):
#   - gondolin (npm i -g @earendil-works/gondolin) + QEMU
#   - pi (npm i -g @earendil-works/pi-coding-agent)
#   - the gondolin-pi template + built snapshot (~/code/gondolin-pi;
#     override with GONDOLIN_PI repo var)
#   - MISTRAL_API_KEY (or MODEL_API_KEY) repo secret

on:
  workflow_call:
    inputs:
      task_file:
        description: 'Path to task file for the agent'
        required: false
        type: string
        default: '.agentic/messages/decision-to-coding/current-task.md'
      bdd_spec:
        description: 'Path to BDD feature file'
        required: false
        type: string
        default: ''
      model:
        description: 'Model to use (pi model id)'
        required: false
        type: string
        default: 'zai-glm-5-3'
      checkout_ref:
        description: 'Git ref to checkout'
        required: false
        type: string
        default: ''
    outputs:
      status:
        description: 'Agent execution status'
        value: ${{ jobs.run-coding-agent.outputs.status }}
      branch:
        description: 'Branch with changes'
        value: ${{ jobs.run-coding-agent.outputs.branch }}

jobs:
  run-coding-agent:
    name: Run coding agent
    runs-on: ${{ vars.GONDOLIN_RUNNER_LABELS || 'self-hosted' }}
    outputs:
      status: ${{ steps.agent.outputs.status }}
      branch: ${{ steps.branch.outputs.branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.head_ref }}
          fetch-depth: 0

      - name: Check runtime prerequisites
        run: |
          command -v gondolin >/dev/null || { echo "::error::gondolin not installed on runner"; exit 1; }
          command -v pi >/dev/null || { echo "::error::pi not installed on runner"; exit 1; }
          GONDOLIN_PI="${GONDOLIN_PI:-$HOME/code/gondolin-pi}"
          [ -e "$GONDOLIN_PI/snapshots/pi-sandbox.qcow2" ] \
            || { echo "::error::pi-sandbox snapshot missing (build: $GONDOLIN_PI/gondolin-pi.sh build)"; exit 1; }
          echo "runtime ok: $GONDOLIN_PI"

      - name: Run coding agent in ephemeral gondolin VM
        id: agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY || secrets.MODEL_API_KEY }}
          AGENT_MODEL: ${{ inputs.model }}
          AGENT_THINKING: low
        run: |
          ./scripts/agent-pi.sh coding \
            --task "${{ inputs.task_file }}" \
            ${{ inputs.bdd_spec && format('--bdd {0}', inputs.bdd_spec) || '' }}

          echo "status=success" >> $GITHUB_OUTPUT

      - name: Commit changes to work branch
        id: branch
        run: |
          BRANCH="agent/coding-${{ github.run_id }}"
          git config user.name "coding-agent"
          git config user.email "coding-agent@facty.dev"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "feat(sdlc): coding agent implementation" || echo "No changes to commit"
          git push -u origin "$BRANCH" || echo "Push failed"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coding-agent-${{ github.run_id }}
          path: |
            .agentic/
            scripts/
            specs/
            docs/adr/
          retention-days: 30
