# Project-local Vibe config (loaded when cwd is trusted:
# run `vibe --trust` once in the repo root, or the sensing calls pass --trust).
#
# This file is SHARED by design: interactive dev sessions and the facty machine
# loops both read it (the sensing fallback runs `vibe -p --agent sensing --trust`
# with cwd=repo root). Keep it runtime-safe: model/provider/agent aliases only —
# no secrets (keys live in ~/.vibe/.env, host-side). Dev-convenience settings
# like max_context_length are fine here too: one-shot sensing prompts are tiny,
# so a larger window only moves the compaction threshold, never the cost.
#
# Default model for every agent: Mistral Large 4.
active_model = "facty-large"

# No co-authorship attribution in commit messages (PO, 2026-11-03).
# Top-level key (env alt: VIBE_INCLUDE_COMMIT_SIGNATURE=false) — under [[models]]
# it is not a Vibe setting and warns at startup.
include_commit_signature = false

# Mistral Large 4 — our own stable alias is the project default. name = the
# catalogue id mistral-large-4-0 (a valid API id; window 1,048,576 live-verified
# via GET /v1/models, 2026-11-17); the alias decouples the project default from
# Mistral's dated routed aliases. thinking "high" = highest level mistral-large-4
# supports (catalogue lists low/medium/high only). The machine loops don't read
# this file at all: pydantic-ai gets model+thinking from code (FACTY_MODEL /
# FACTY_THINKING=low in sensing.py); only the vibe -p fallback uses this config,
# via the sensing profile (thinking=low pinned there).
# auto_compact_threshold must stay under window - 24k headroom (harness bounds).
[[models]]
name = "mistral-large-4-0"
provider = "mistral"
alias = "facty-large"
thinking = "high"              # dev default; sensing profile pins "low"
max_context_length = 1048576
auto_compact_threshold = 800000

# RESUME PIN: Vibe snapshots `active_model` into the session at creation and, on
# resume, restores it via the runtime-overrides layer — which outranks project
# config AND VIBE_* env vars (vibe 3.1.3: app_server/_session_model.py +
# _unified_harness_backend_adapter.py `_apply_restored_pin`). Sessions created
# while the user-layer default was active therefore resume pinned to Mistral's
# routed alias `mistral-large-4-0-3`, which the catalogue maps to the canonical
# row `mistral-large-4-0` — whose catalogue entry ships a stale 400k compaction
# threshold. Overriding the CANONICAL row here (name = mistral-large-4-0, no
# alias, so the key is the canonical id and the routed aliases still resolve to
# it) means even old resumed sessions get the real 1M window / 800k threshold.
# Do NOT add a row with name = "mistral-large-4-0-3": an alias that is itself a
# model key resolves to nothing (_model_aliases.py) and the literal routed name
# is not a valid API id ("Invalid model" on the first call). In a resumed
# session you can also just run `/model facty-large` to re-pin immediately.
[[models]]
name = "mistral-large-4-0"
provider = "mistral"
thinking = "high"
max_context_length = 1048576
auto_compact_threshold = 800000
