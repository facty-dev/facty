# Project-local Vibe config (loaded when cwd is trusted:
# run `vibe --trust` once in the repo root, or the sensing calls pass --trust).
#
# This file is SHARED by design: interactive dev sessions and the facty machine
# loops both read it (the sensing fallback runs `vibe -p --agent sensing --trust`
# with cwd=repo root). Keep it runtime-safe: model/provider/agent aliases only —
# no secrets (keys live in ~/.vibe/.env, host-side). Dev-convenience settings
# like max_context_length are fine here too: one-shot sensing prompts are tiny,
# so a larger window only moves the compaction threshold, never the cost.
#
# Default model for every agent: Mistral Large 4.
active_model = "facty-large"

# No co-authorship attribution in commit messages (PO, 2026-11-03).
# Top-level key (env alt: VIBE_INCLUDE_COMMIT_SIGNATURE=false) — under [[models]]
# it is not a Vibe setting and warns at startup.
include_commit_signature = false

[[models]]
name = "mistral-large-4"       # canonical API name
provider = "mistral"
alias = "facty-large"
thinking = "high"              # highest level mistral-large-4 supports (catalogue: low/medium/high) — dev default; the sensing profile pins "low"
# mistral-large-4 actually serves a 1,048,576-token window (live-verified against
# GET /v1/models, 2026-11). 800k window leaves headroom below the true value;
# auto_compact_threshold must stay under window - 24k (harness bounds), hence 750k.
max_context_length = 800000
auto_compact_threshold = 750000

# The catalogue routes "Mistral Large 4" under id mistral-large-4-0 (aliases
# mistral-large-4-0-3 / mistral-large-4) with auto_compact_threshold=400000 —
# that 400k is what the status-bar gauge shows as the limit. Override the same
# model key so the standard model gets the real window too.
[[models]]
name = "mistral-large-4-0"     # catalogue id behind the mistral-large-4 aliases
provider = "mistral"
alias = "mistral-large-4-0-3"
max_context_length = 1048576   # live-verified via GET /v1/models
auto_compact_threshold = 800000
