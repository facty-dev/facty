# Project-local Vibe config (loaded when cwd is trusted:
# run `vibe --trust` once in the repo root, or the sensing calls pass --trust).
#
# This file is SHARED by design: interactive dev sessions and the facty machine
# loops both read it (the sensing fallback runs `vibe -p --agent sensing --trust`
# with cwd=repo root). Keep it runtime-safe: model/provider/agent settings only —
# no secrets (keys live in ~/.vibe/.env, host-side). Dev-convenience settings
# like max_context_length are fine here too: one-shot sensing prompts are tiny,
# so a larger window only moves the compaction threshold, never the cost.
#
# Default model for every agent: Mistral Large 4, keyed by its CANONICAL id
# (no custom alias — see the resume-pin note below).
active_model = "mistral-large-4-0"

# No co-authorship attribution in commit messages (PO, 2026-11-03).
# Top-level key (env alt: VIBE_INCLUDE_COMMIT_SIGNATURE=false) — under [[models]]
# it is not a Vibe setting and warns at startup.
include_commit_signature = false

# Mistral Large 4 — ONE row, keyed by the canonical catalogue id
# mistral-large-4-0 (a valid API id; window 1,048,576 live-verified via
# GET /v1/models, 2026-11-17). No alias: the canonical id IS the stable name —
# Mistral's dated routed aliases (mistral-large-4-0-3, mistral-large-4) are
# catalogue aliases OF this row (catalog_model_aliases), so keying on the
# canonical id covers both fresh sessions and old resumed ones with a single
# row. thinking "high" = highest level mistral-large-4 supports (catalogue
# lists low/medium/high only). The machine loops don't read this file at all:
# pydantic-ai gets model+thinking from code (FACTY_MODEL / FACTY_THINKING=low
# in sensing.py); only the vibe -p fallback uses this config, via the sensing
# profile (thinking=low pinned there).
# auto_compact_threshold must stay under window - 24k headroom (harness bounds).
[[models]]
name = "mistral-large-4-0"
provider = "mistral"
thinking = "high"              # dev default; sensing profile pins "low"
max_context_length = 1048576
auto_compact_threshold = 880000

# RESUME PIN (vibe 3.1.3): each session snapshots `active_model` into its
# metadata at creation and, on resume, restores it via the runtime-overrides
# layer — which outranks project config AND VIBE_* env vars
# (app_server/_session_model.py + _unified_harness_backend_adapter.py
# `_apply_restored_pin`; layer order in core/config/default_orchestrator.py).
# Sessions created while the user-layer default (routed alias
# mistral-large-4-0-3) was active therefore resume pinned to that alias — which
# resolves through catalog_model_aliases to THIS canonical row, so overriding
# the canonical row above (not a row named after the alias!) gives even old
# resumed sessions the real 1M window / 800k threshold while keeping the valid
# API id. Do NOT add a [[models]] row with name = "mistral-large-4-0-3": an
# alias that is itself a model key resolves to nothing (_model_aliases.py) and
# the literal routed name is rejected by the API ("Invalid model", code 1500).
# In a resumed session you can also just run `/model mistral-large-4-0`.
