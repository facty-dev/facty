# Plain-Docker dev alternative to the SmolVM image (faster iteration on the host).
#   docker compose -f compose.yaml up -d
#   make deps && python -m facty init-db
services:
  terminusdb:
    image: terminusdb/terminusdb-server:v12.1.0-rc2
    ports:
      - "6363:6363"
    environment:
      TERMINUSDB_ADMIN_PASS: root
      TERMINUSDB_SERVER_DB_PATH: /app/terminusdb/storage
      # 12.1 native VectorLink index (RC): needs an embedding provider (separate
      # `embeddings`/Ollama service per the quickstart) — we use BYO-key Mistral
      # embeddings + content-addressed vectors instead (ADR-0008/0009), so this
      # stays off: # TERMINUSDB_INDEXER_BACKEND: vectorlink
    volumes:
      - terminusdb-data:/app/terminusdb/storage
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - terminusdb
    environment:
      TERMINUSDB_URL: http://terminusdb:6363
      TERMINUSDB_PASS: root
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?set MISTRAL_API_KEY in the env or ~/.facty/.env}
    volumes:
      - ./:/app
    command: tail -f /dev/null
volumes:
  terminusdb-data:
